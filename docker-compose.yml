services:
  backend:
    build:
      context: ./backend
    container_name: ai-buddy-backend
    environment:
      AI_BUDDY_DEVICE_TOKEN: ${AI_BUDDY_DEVICE_TOKEN:-local-development-token}
      AI_BUDDY_PROTOCOL_VERSION: ${AI_BUDDY_PROTOCOL_VERSION:-1}
      AI_BUDDY_PUBLIC_BASE_URL: ${AI_BUDDY_PUBLIC_BASE_URL:-}
      AI_BUDDY_AGENT_MODEL: ${AI_BUDDY_AGENT_MODEL:-gemma4:e4b}
      AI_BUDDY_AGENT_PROVIDER: ${AI_BUDDY_AGENT_PROVIDER:-ollama}
      AI_BUDDY_OLLAMA_BASE_URL: ${AI_BUDDY_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_BUDDY_AGENT_TIMEOUT_SECONDS: ${AI_BUDDY_AGENT_TIMEOUT_SECONDS:-90}
      AI_BUDDY_STT_PROVIDER: ${AI_BUDDY_STT_PROVIDER:-faster_whisper}
      AI_BUDDY_STT_MODEL: ${AI_BUDDY_STT_MODEL:-base}
      AI_BUDDY_STT_LANGUAGE: ${AI_BUDDY_STT_LANGUAGE:-es}
      AI_BUDDY_STT_TIMEOUT_SECONDS: ${AI_BUDDY_STT_TIMEOUT_SECONDS:-90}
      AI_BUDDY_TTS_PROVIDER: ${AI_BUDDY_TTS_PROVIDER:-piper}
      AI_BUDDY_TTS_VOICE: ${AI_BUDDY_TTS_VOICE:-es_AR-daniela-high}
      AI_BUDDY_TTS_TIMEOUT_SECONDS: ${AI_BUDDY_TTS_TIMEOUT_SECONDS:-90}
      AI_BUDDY_DATA_DIR: /data
      AI_BUDDY_GROKBOT_WEBHOOK_URL: ${AI_BUDDY_GROKBOT_WEBHOOK_URL:-}
      AI_BUDDY_GROKBOT_WEBHOOK_TOKEN: ${AI_BUDDY_GROKBOT_WEBHOOK_TOKEN:-}
      AI_BUDDY_GROKBOT_CALLBACK_TOKEN: ${AI_BUDDY_GROKBOT_CALLBACK_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AI_BUDDY_PORT:-8000}:8000"
    volumes:
      - stt_models:/root/.cache/huggingface
      - buddy_data:/data
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
    profiles:
      - tunnel
    restart: unless-stopped

volumes:
  stt_models:
  buddy_data:
